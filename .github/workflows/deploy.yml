name: Deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: blog-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
      CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
      CODEDEPLOY_BUCKET: ${{ vars.CODEDEPLOY_BUCKET }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$image" .
          docker push "$image"
          echo "IMAGE_URI=$image" >> "$GITHUB_ENV"

      - name: Create CodeDeploy revision
        run: |
          mkdir revision
          cp codedeploy/appspec.yml revision/appspec.yml
          cp -R codedeploy/scripts revision/scripts
          cp deploy/compose.production.yaml deploy/deploy-service.sh deploy/nginx-blog.conf revision/
          printf '%s\n' "$IMAGE_URI" > revision/image-uri.txt
          printf '%s\n' "$AWS_REGION" > revision/aws-region.txt
          cd revision
          zip -qr ../revision.zip .

      - name: Upload revision and deploy
        run: |
          key="codedeploy/blog-backend/${GITHUB_SHA}.zip"
          aws s3 cp revision.zip "s3://$CODEDEPLOY_BUCKET/$key"
          deployment_id="$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --revision "revisionType=S3,s3Location={bucket=$CODEDEPLOY_BUCKET,key=$key,bundleType=zip}" \
            --description "blog-backend ${GITHUB_SHA}" \
            --query deploymentId \
            --output text)"
          aws deploy wait deployment-successful --deployment-id "$deployment_id"

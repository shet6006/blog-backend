name: Verify backend

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches-ignore:
      - master
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  test-and-build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

      - name: Build production container
        run: docker build --tag blog-backend:verify .

      - name: Validate deployment harness
        env:
          DB_NAME: blog
          DB_USER: blog
          DB_PASSWORD: test-password
          DB_ROOT_PASSWORD: test-root-password
          JWT_SECRET: test-only-jwt-secret-that-is-long-enough
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          BACKEND_IMAGE: blog-backend:verify
        run: |
          bash -n deploy/*.sh
          docker compose --file deploy/compose.production.yaml config --quiet

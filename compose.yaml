services:
  db:
    image: mariadb:10.5
    environment:
      MARIADB_DATABASE: blog
      MARIADB_USER: blog
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-blog-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/blog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: blog
      DB_PASSWORD: ${DB_PASSWORD:-local-blog-password}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-before-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      STORAGE_LOCATION: /data/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads:
